<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TextDrop | かんたんテキスト → ファイル変換ツール</title>
<link rel="icon" type="image/svg+xml" href="./textdrop-favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;
    background-color: #f8fafc;
    color: #1f2937;
    transition: background-color .2s ease, color .2s ease;
  }
  body.dark { background-color: #0f172a; color: #e5e7eb; }

  .panel { background-color: #ffffff; border: 1px solid #e2e8f0; }
  body.dark .panel { background-color: #1e293b; border-color: #334155; }

  .toolbar { background-color: #ffffff; border-bottom: 1px solid #e2e8f0; }
  body.dark .toolbar { background-color: #1e293b; border-color: #334155; }

  header.appheader { background-color: #1e293b; }
  body.dark header.appheader { background-color: #0b1220; }

  textarea#editor { background-color: #ffffff; color: #1f2937; }
  body.dark textarea#editor { background-color: #0f172a; color: #e5e7eb; }

  .input-filename { background-color: #f8fafc; color: #1f2937; border: 1px solid #cbd5e1; }
  body.dark .input-filename { background-color: #0f172a; color: #e5e7eb; border-color: #475569; }

  .btn-icon { background-color: #f1f5f9; color: #334155; }
  .btn-icon:hover { background-color: #e2e8f0; }
  body.dark .btn-icon { background-color: #334155; color: #e5e7eb; }
  body.dark .btn-icon:hover { background-color: #475569; }

  .tab-btn { color: #64748b; background-color: #e2e8f0; }
  .tab-btn.active { color: #ffffff; background-color: #3b82f6; }
  body.dark .tab-btn { color: #cbd5e1; background-color: #334155; }
  body.dark .tab-btn.active { background-color: #60a5fa; color: #0f172a; }

  footer.appfooter { background-color: #ffffff; border-top: 1px solid #e2e8f0; color: #64748b; }
  body.dark footer.appfooter { background-color: #1e293b; border-color: #334155; color: #94a3b8; }

  .divider { border-color: #e2e8f0; }
  body.dark .divider { border-color: #334155; }

  /* Markdown preview */
  #preview h1 { font-size: 1.6em; font-weight: 700; margin: .6em 0 .3em; }
  #preview h2 { font-size: 1.35em; font-weight: 700; margin: .6em 0 .3em; }
  #preview h3 { font-size: 1.15em; font-weight: 700; margin: .5em 0 .3em; }
  #preview p { margin: .5em 0; line-height: 1.75; }
  #preview ul { list-style: disc; padding-left: 1.5em; margin: .5em 0; }
  #preview ol { list-style: decimal; padding-left: 1.5em; margin: .5em 0; }
  #preview li { margin: .15em 0; }
  #preview blockquote { border-left: 4px solid #94a3b8; padding-left: 1em; color: #64748b; margin: .5em 0; }
  #preview code { background-color: #e2e8f0; padding: .1em .35em; border-radius: .3em; font-size: .9em; font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
  #preview pre { background-color: #0f172a; color: #e5e7eb; padding: 1em; border-radius: .5em; overflow-x: auto; margin: .6em 0; }
  #preview pre code { background-color: transparent; padding: 0; }
  #preview a { color: #3b82f6; text-decoration: underline; }
  #preview table { border-collapse: collapse; margin: .6em 0; width: 100%; }
  #preview th, #preview td { border: 1px solid #cbd5e1; padding: .4em .6em; }
  #preview hr { border: none; border-top: 1px solid #cbd5e1; margin: 1em 0; }
  #preview img { max-width: 100%; }
  #preview input[type=checkbox] { margin-right: .4em; }
  body.dark #preview blockquote { border-left-color: #475569; color: #94a3b8; }
  body.dark #preview code { background-color: #334155; }
  body.dark #preview th, body.dark #preview td { border-color: #475569; }
  body.dark #preview hr { border-top-color: #475569; }

  textarea#editor::placeholder { color: #94a3b8; }

  .icon { width: 1.15em; height: 1.15em; flex: none; }

  /* Toast */
  #toast {
    position: fixed; left: 50%; bottom: 3.5rem; transform: translate(-50%, 20px);
    background-color: #1e293b; color: #f8fafc; padding: .6rem 1rem; border-radius: .5rem;
    font-size: .8rem; box-shadow: 0 10px 25px rgba(0,0,0,.25);
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    display: flex; align-items: center; gap: .5rem; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  body.dark #toast { background-color: #f1f5f9; color: #0f172a; }

  kbd {
    font-size: .7rem; padding: .05rem .3rem; border-radius: .25rem;
    border: 1px solid currentColor; opacity: .7;
  }

  @media (max-width: 1023px) { .desktop-only { display: none !important; } }
  @media (min-width: 1024px) { .mobile-only { display: none !important; } }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- ===== SVG sprite ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-markdown" viewBox="0 0 24 24">
      <path fill="currentColor" stroke="none" d="M22.04 4.93c.52 0 .96.44.96.99v12.16c0 .55-.44.99-.96.99H1.96C1.44 19.07 1 18.63 1 18.08V5.92c0-.55.44-.99.96-.99zM18.56 15.64V8.42l-2.5 3.08-2.49-3.08v7.22h-2.5V8.42l2.5 3.08 2.49-3.08v7.22zM5.44 15.64l3.74-3.59H6.69V8.42H4.19v3.63H2.95z"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/>

    </symbol>

    </symbol>

    </symbol>

        <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
        <circle cx="12" cy="12" r="3"/>

    </symbol>

        <path d="M8.5 4h6v4h-6zM8 13.5h8V20H8z"/>

</svg>

<!-- Header -->
<header class="appheader text-white px-4 sm:px-6 py-3 flex items-center justify-between shadow-md">
  <div class="flex items-center gap-2">
    <svg class="icon" style="width:1.6em;height:1.6em"><use href="#i-markdown"></use></svg>
    <h1 class="font-bold text-lg tracking-wide">TextDrop</h1>
    <span class="hidden sm:inline text-xs text-slate-300 ml-2">打ち込んで、好きな拡張子で保存。</span>
  </div>
  <button id="themeToggle" class="btn-icon rounded-full w-9 h-9 flex items-center justify-center" title="ダーク / ライト切り替え" aria-label="テーマ切り替え">
    <svg class="icon"><use href="#i-moon"></use></svg>
  </button>
</header>

<!-- Toolbar -->
<div class="toolbar px-4 sm:px-6 py-3 flex flex-wrap items-center gap-2 sm:gap-3">
  <label for="filename" class="text-sm font-medium">ファイル名</label>
  <input id="filename" type="text" placeholder="メモ_20261005" spellcheck="false"
         class="input-filename rounded-md px-3 py-1.5 text-sm w-36 sm:w-52 focus:outline-none focus:ring-2 focus:ring-blue-400">

  <span class="text-sm opacity-50 select-none">.</span>
  <input id="ext" type="text" list="extList" value="md" spellcheck="false" aria-label="拡張子"
         class="input-filename rounded-md px-2 py-1.5 text-sm w-16 font-mono focus:outline-none focus:ring-2 focus:ring-blue-400">
  <datalist id="extList">
    <option value="md"></option>
    <option value="txt"></option>
    <option value="markdown"></option>
    <option value="html"></option>
    <option value="css"></option>
    <option value="js"></option>
    <option value="ts"></option>
    <option value="json"></option>
    <option value="csv"></option>
    <option value="tsv"></option>
    <option value="yml"></option>
    <option value="xml"></option>
    <option value="py"></option>
    <option value="rb"></option>
    <option value="php"></option>
    <option value="sql"></option>
    <option value="sh"></option>
    <option value="log"></option>
    <option value="srt"></option>
  </datalist>

  <div class="flex-1"></div>

  <button id="copyBtn" class="btn-icon rounded-md px-3 py-1.5 text-sm flex items-center gap-1.5" title="全文をコピー (Ctrl+Shift+C)">
    <svg class="icon"><use href="#i-copy"></use></svg><span class="hidden sm:inline">コピー</span>
  </button>
  <button id="wrapBtn" class="btn-icon rounded-md px-3 py-1.5 text-sm flex items-center gap-1.5" title="折り返し切り替え" aria-pressed="true">
    <svg class="icon"><use href="#i-hash"></use></svg><span class="hidden sm:inline">折り返し</span>
  </button>
  <button id="clearBtn" class="btn-icon rounded-md px-3 py-1.5 text-sm flex items-center gap-1.5" title="内容をクリア">
    <svg class="icon"><use href="#i-trash"></use></svg><span class="hidden sm:inline">クリア</span>
  </button>
  <button id="downloadBtn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-md px-4 py-1.5 text-sm font-semibold flex items-center gap-1.5 shadow" title="ダウンロード (Ctrl+S)">
    <svg class="icon"><use href="#i-download"></use></svg>ダウンロード
  </button>
</div>

<!-- Mobile tabs -->
<div class="mobile-only flex gap-2 px-4 pt-3">
  <button id="tabEdit" class="tab-btn active flex-1 rounded-md py-1.5 text-sm font-medium flex items-center justify-center gap-1.5">
    <svg class="icon"><use href="#i-edit"></use></svg>編集
  </button>
  <button id="tabPreview" class="tab-btn flex-1 rounded-md py-1.5 text-sm font-medium flex items-center justify-center gap-1.5">
    <svg class="icon"><use href="#i-eye"></use></svg>プレビュー
  </button>
</div>

<!-- Main -->
<main class="flex-1 px-4 sm:px-6 py-3 grid grid-cols-1 lg:grid-cols-2 gap-3 overflow-hidden">
  <div id="editPane" class="panel rounded-lg flex flex-col overflow-hidden min-h-[40vh] lg:min-h-0">
    <div class="desktop-only text-xs font-semibold px-3 py-2 opacity-60 border-b divider">入力 (Markdown / プレーンテキスト)</div>
    <textarea id="editor" spellcheck="false"
      class="flex-1 w-full resize-none p-4 text-sm leading-relaxed focus:outline-none font-mono"
      placeholder="# ここに書いてみよう

- リスト1
- リスト2

**太字** や コード も使えます。"></textarea>
  </div>

  <div id="previewPane" class="panel rounded-lg flex flex-col overflow-hidden min-h-[40vh] lg:min-h-0">
    <div class="desktop-only flex items-center justify-between text-xs font-semibold px-3 py-2 opacity-60 border-b divider">
      <span>プレビュー</span>
      <span id="previewNote" class="font-normal opacity-70"></span>
    </div>
    <div id="preview" class="flex-1 overflow-auto p-4 text-sm"></div>
  </div>
</main>

<!-- Footer -->
<footer class="appfooter px-4 sm:px-6 py-2.5 flex flex-wrap items-center justify-between text-xs gap-2">
  <div class="flex items-center gap-4">
    <span id="charCount">文字数: 0</span>
    <span id="lineCount">行数: 1</span>
    <span id="byteCount" class="hidden sm:inline">サイズ: 0 B</span>
  </div>
  <div class="flex items-center gap-2">
    <span id="outName" class="font-mono opacity-60"></span>
    <span id="saveStatus" class="flex items-center gap-1 opacity-70">
      <svg class="icon"><use href="#i-check"></use></svg>自動保存しました
    </span>
  </div>
</footer>

<div id="toast"><svg class="icon"><use href="#i-check"></use></svg><span id="toastText"></span></div>

<script>
  const editor      = document.getElementById('editor');
  const preview     = document.getElementById('preview');
  const filenameIn  = document.getElementById('filename');
  const extIn       = document.getElementById('ext');
  const charCount   = document.getElementById('charCount');
  const lineCount   = document.getElementById('lineCount');
  const byteCount   = document.getElementById('byteCount');
  const saveStatus  = document.getElementById('saveStatus');
  const outName     = document.getElementById('outName');
  const themeToggle = document.getElementById('themeToggle');
  const copyBtn     = document.getElementById('copyBtn');
  const clearBtn    = document.getElementById('clearBtn');
  const wrapBtn     = document.getElementById('wrapBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const tabEdit     = document.getElementById('tabEdit');
  const tabPreview  = document.getElementById('tabPreview');
  const editPane    = document.getElementById('editPane');
  const previewPane = document.getElementById('previewPane');
  const toast       = document.getElementById('toast');
  const toastText   = document.getElementById('toastText');
  const toastIcon   = toast.querySelector('use');

  const K = { content:'md_memo_content', file:'md_memo_filename', ext:'md_memo_ext', theme:'md_memo_theme', wrap:'md_memo_wrap' };

  const MIME = {
    md:'text/markdown', markdown:'text/markdown', txt:'text/plain', log:'text/plain', srt:'text/plain',
    html:'text/html', css:'text/css', js:'text/javascript', ts:'text/typescript', json:'application/json',
    csv:'text/csv', tsv:'text/tab-separated-values', yml:'text/yaml', yaml:'text/yaml', xml:'application/xml',
    py:'text/x-python', rb:'text/x-ruby', php:'application/x-httpd-php', sql:'application/sql', sh:'application/x-sh'
  };
  const RENDERABLE = new Set(['md','markdown','txt','mdown','mkd']);

  /* ---------- helpers ---------- */
  const today = () => {
    const d = new Date();
    return `メモ_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  };
  const sanitizeBase = s => s.replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').trim();
  const sanitizeExt  = s => s.toLowerCase().replace(/[^a-z0-9_\-]/g, '');
  const mimeFor = e => MIME[e] || 'text/plain';

  let toastTimer;
  function showToast(msg, ok = true) {
    toastIcon.setAttribute('href', ok ? '#i-check' : '#i-alert');
    toastText.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  function currentName() {
    const base = sanitizeBase(filenameIn.value) || today();
    const ext  = sanitizeExt(extIn.value) || 'txt';
    return `${base}.${ext}`;
  }
  function refreshOutName() {
    const ext = sanitizeExt(extIn.value);
    outName.textContent = currentName();
    document.getElementById('previewNote').textContent =
      RENDERABLE.has(ext) ? '' : 'この拡張子はプレビューをテキスト表示しています';
  }

  /* ---------- preview ---------- */
  function renderPreview() {
    const text = editor.value;
    const ext  = sanitizeExt(extIn.value);
    if (!RENDERABLE.has(ext)) {           // Markdown以外はそのままテキスト表示
      const pre = document.createElement('pre');
      pre.className = 'whitespace-pre-wrap font-mono text-xs leading-relaxed';
      pre.style.color = 'inherit';
      pre.textContent = text;
      preview.innerHTML = '';
      preview.appendChild(pre);
      return;
    }
    preview.innerHTML = DOMPurify.sanitize(marked.parse(text || ''));
  }

  function updateCounters() {
    const text = editor.value;
    charCount.textContent = `文字数: ${text.length}`;
    lineCount.textContent = `行数: ${text === '' ? 1 : text.split('\n').length}`;
    const bytes = new Blob([text]).size;
    byteCount.textContent = `サイズ: ${bytes < 1024 ? bytes + ' B' : (bytes/1024).toFixed(1) + ' KB'}`;
  }

  /* ---------- autosave ---------- */
  let saveTimer;
  function scheduleSave() {
    saveStatus.innerHTML = '<svg class="icon"><use href="#i-save"></use></svg>保存中...';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      localStorage.setItem(K.content, editor.value);
      localStorage.setItem(K.file, filenameIn.value);
      localStorage.setItem(K.ext, extIn.value);
      saveStatus.innerHTML = '<svg class="icon"><use href="#i-check"></use></svg>自動保存しました';
    }, 400);
  }

  editor.addEventListener('input', () => { renderPreview(); updateCounters(); scheduleSave(); });
  filenameIn.addEventListener('input', () => { refreshOutName(); scheduleSave(); });
  extIn.addEventListener('input', () => {
    extIn.value = extIn.value.replace(/[^A-Za-z0-9_\-]/g, '');
    renderPreview(); refreshOutName(); scheduleSave();
  });

  /* ---------- theme ---------- */
  function applyTheme(dark) {
    document.body.classList.toggle('dark', dark);
    themeToggle.querySelector('use').setAttribute('href', dark ? '#i-sun' : '#i-moon');
    localStorage.setItem(K.theme, dark ? 'dark' : 'light');
  }
  themeToggle.addEventListener('click', () => applyTheme(!document.body.classList.contains('dark')));

  /* ---------- wrap toggle ---------- */
  function applyWrap(on) {
    editor.style.whiteSpace = on ? 'pre-wrap' : 'pre';
    editor.style.overflowX  = on ? 'hidden' : 'auto';
    wrapBtn.style.outline = on ? '2px solid #3b82f6' : 'none';
    wrapBtn.style.outlineOffset = '2px';
    wrapBtn.setAttribute('aria-pressed', String(on));
  }
  wrapBtn.addEventListener('click', () => {
    const on = editor.style.whiteSpace !== 'pre';
    applyWrap(on);
    localStorage.setItem(K.wrap, on ? '1' : '0');
  });

  /* ---------- actions ---------- */
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(editor.value); showToast('コピーしました'); }
    catch { showToast('コピーに失敗しました', false); }
  });

  clearBtn.addEventListener('click', () => {
    if (!editor.value) return;
    if (confirm('入力内容をすべて削除しますか？')) {
      editor.value = '';
      renderPreview(); updateCounters(); scheduleSave(); editor.focus();
    }
  });

  function download() {
    const name = currentName();
    const blob = new Blob([editor.value], { type: `${mimeFor(sanitizeExt(extIn.value))};charset=utf-8` });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(`${name} を保存しました`);
  }
  downloadBtn.addEventListener('click', download);

  /* ---------- mobile tabs ---------- */
  function showEdit() {
    tabEdit.classList.add('active'); tabPreview.classList.remove('active');
    editPane.classList.remove('hidden'); previewPane.classList.add('hidden');
  }
  function showPreview() {
    tabPreview.classList.add('active'); tabEdit.classList.remove('active');
    previewPane.classList.remove('hidden'); editPane.classList.add('hidden');
  }
  tabEdit.addEventListener('click', showEdit);
  tabPreview.addEventListener('click', showPreview);
  function handleResize() {
    if (window.innerWidth >= 1024) { editPane.classList.remove('hidden'); previewPane.classList.remove('hidden'); }
    else { tabEdit.classList.contains('active') ? showEdit() : showPreview(); }
  }
  window.addEventListener('resize', handleResize);

  /* ---------- shortcuts ---------- */
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); download(); }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'c') { e.preventDefault(); copyBtn.click(); }
    if (e.key === 'Tab' && document.activeElement === editor) {
      e.preventDefault();
      const s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(en);
      editor.selectionStart = editor.selectionEnd = s + 2;
      renderPreview(); updateCounters(); scheduleSave();
    }
  });

    const saved = localStorage.getItem(K.content);
    editor.value = saved !== null ? saved :
